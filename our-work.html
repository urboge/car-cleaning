<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Work – TIMPRA</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="icon" href="/favicon.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #0a0a0a;
            color: #fff;
            overflow-x: hidden;
            animation: fadeIn 0.8s ease;
        }
        ::-webkit-scrollbar { display: none; }
        body { scrollbar-width: none; }
        body::selection { background-color: white; color: black; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        header h1 { font-weight: 600; letter-spacing: 2px; font-size: 1.2rem; }
        nav a {
            color: #ccc;
            margin-left: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            position: relative;
        }
        nav a::after {
            content: '';
            position: absolute;
            left: 0; bottom: -3px;
            width: 0; height: 1px;
            background: #fff;
            transition: 0.3s;
        }
        nav a:hover::after { width: 100%; }

        /* HERO */
        .hero {
            min-height: 45vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.9)),
                        url('https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2');
            background-size: cover;
            background-position: center;
        }
        .hero h2 {
            font-size: 2.3rem;
            margin-bottom: 10px;
            animation: slideUp 1s ease;
        }
        .hero p {
            color: #bbb;
            animation: slideUp 1.2s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* FILTER BAR */
        .filter-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 40px 20px 30px;
        }
        .filter-btn {
            padding: 8px 20px;
            border-radius: 30px;
            border: 1px solid #333;
            background: transparent;
            color: #777;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .filter-btn:hover, .filter-btn.active {
            background: #fff;
            color: #000;
            border-color: #fff;
        }

        /* GALLERY */
        .gallery {
            columns: 3 280px;
            column-gap: 14px;
            padding: 0 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery-item {
            break-inside: avoid;
            margin-bottom: 14px;
            border-radius: 16px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }
        .gallery-item.show { opacity: 1; transform: translateY(0); }

        /* Placeholder shown before image loads */
        .placeholder {
            position: absolute;
            inset: 0;
            filter: blur(18px);
            transform: scale(1.1); /* hide blur edges */
            transition: opacity 0.5s ease;
            opacity: 1;
        }
        .placeholder.hide { opacity: 0; pointer-events: none; }

        /* Car-interior-like gradient palettes, cycling per item */
        .palette-0 {
            background:
                radial-gradient(ellipse at 30% 60%, #3a2a1a 0%, transparent 60%),
                radial-gradient(ellipse at 70% 40%, #1a1208 0%, transparent 55%),
                radial-gradient(ellipse at 50% 80%, #5c3d1e 0%, transparent 50%),
                linear-gradient(160deg, #0d0d0d 0%, #2a1a0a 50%, #1a1008 100%);
        }
        .palette-1 {
            background:
                radial-gradient(ellipse at 40% 55%, #1c1c1c 0%, transparent 60%),
                radial-gradient(ellipse at 65% 35%, #2e2e2e 0%, transparent 55%),
                radial-gradient(ellipse at 25% 75%, #111 0%, transparent 50%),
                linear-gradient(150deg, #0a0a0a 0%, #222 50%, #111 100%);
        }
        .palette-2 {
            background:
                radial-gradient(ellipse at 35% 60%, #2a1f14 0%, transparent 55%),
                radial-gradient(ellipse at 68% 38%, #1e1510 0%, transparent 50%),
                radial-gradient(ellipse at 50% 85%, #4a3520 0%, transparent 45%),
                linear-gradient(155deg, #100c08 0%, #3a2a18 55%, #1a1208 100%);
        }
        .palette-3 {
            background:
                radial-gradient(ellipse at 45% 50%, #181818 0%, transparent 60%),
                radial-gradient(ellipse at 70% 30%, #282828 0%, transparent 55%),
                radial-gradient(ellipse at 20% 70%, #202020 0%, transparent 50%),
                linear-gradient(145deg, #0c0c0c 0%, #1e1e1e 50%, #141414 100%);
        }
        .palette-4 {
            background:
                radial-gradient(ellipse at 30% 65%, #251a0e 0%, transparent 55%),
                radial-gradient(ellipse at 72% 42%, #1a1208 0%, transparent 50%),
                radial-gradient(ellipse at 55% 80%, #3d2b12 0%, transparent 48%),
                linear-gradient(158deg, #0e0a05 0%, #2e2010 55%, #160f05 100%);
        }

        .gallery-item img {
            width: 100%;
            min-height: 350px;
            display: block;
            position: relative;
            z-index: 1;
            transition: transform 0.5s ease, opacity 0.5s ease;
            opacity: 0;
        }
        .gallery-item img.loaded { opacity: 1; }
        .gallery-item:hover img { transform: scale(1.04); }

        .gallery-item .overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, transparent 55%);
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            padding: 14px;
        }
        .gallery-item:hover .overlay { opacity: 1; }
        .overlay-label {
            font-size: 0.78rem;
            color: #ddd;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.93);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 3000;
            padding: 20px;
        }
        .lightbox.open { display: flex; }
        .lightbox img {
            max-width: 90vw;
            max-height: 88vh;
            border-radius: 14px;
            object-fit: contain;
        }
        .lightbox-close {
            position: absolute;
            top: 20px; right: 24px;
            font-size: 2rem;
            cursor: pointer;
            color: #aaa;
            background: none;
            border: none;
            transition: color 0.2s;
        }
        .lightbox-close:hover { color: #fff; }
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.5rem;
            cursor: pointer;
            color: #aaa;
            background: rgba(255,255,255,0.08);
            border: none;
            border-radius: 50%;
            width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        .lightbox-nav:hover { color: #fff; background: rgba(255,255,255,0.18); }
        .lightbox-prev { left: 16px; }
        .lightbox-next { right: 16px; }
        .lightbox-counter {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 0.8rem;
            color: #666;
        }

        footer {
            padding: 20px;
            text-align: center;
            background: #000;
            color: #777;
            font-size: 0.8rem;
        }

        @media (max-width: 480px) {
            header { flex-direction: column; gap: 10px; }
            .hero h2 { font-size: 1.5rem; }
            .gallery { columns: 1; }
        }
    </style>
</head>
<body>

<header>
    <h1>TIMPRA</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#services">Services</a>
        <a href="index.html#contact">Contact</a>
    </nav>
</header>

<section class="hero">
    <h2>Our Work</h2>
    <p>Cars we've cleaned — results speak for themselves.</p>
</section>

<div class="filter-bar">
    <button class="filter-btn active" onclick="filterGallery('all', this)">All</button>
    <button class="filter-btn" onclick="filterGallery('interior', this)">Interior</button>
    <button class="filter-btn" onclick="filterGallery('windows', this)">Windows</button>
</div>

<div class="gallery" id="gallery"></div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()"><ion-icon name="close-outline"></ion-icon></button>
    <button class="lightbox-nav lightbox-prev" onclick="changePhoto(-1)"><ion-icon name="chevron-back-outline"></ion-icon></button>
    <img id="lightboxImg" src="" alt="">
    <button class="lightbox-nav lightbox-next" onclick="changePhoto(1)"><ion-icon name="chevron-forward-outline"></ion-icon></button>
    <div class="lightbox-counter" id="lightboxCounter"></div>
</div>

<footer>
    <p>© 2026 TIMPRA</p>
</footer>

<script>
    // ─────────────────────────────────────────────────────────────────────────
    // ADD YOUR PHOTOS HERE
    // src   → file name (put images in same folder) or full URL
    // label → caption shown on hover
    // tag   → 'interior' | 'windows'
    // ─────────────────────────────────────────────────────────────────────────
    const photos = [
        { src: "images/cars/1.png", label: "BMW 3 Series – Interior", tag: "interior" },
        { src: "images/cars/1.png", label: "BMW 3 Series – Interior", tag: "interior" },
    ];
    // ─────────────────────────────────────────────────────────────────────────

    let currentFilter = 'all';
    let currentIndex  = 0;

    function visiblePhotos() {
        return currentFilter === 'all'
            ? photos
            : photos.filter(p => p.tag === currentFilter);
    }

    function renderGallery() {
        const gallery = document.getElementById('gallery');
        gallery.innerHTML = '';
        visiblePhotos().forEach((photo, i) => {
            const item = document.createElement('div');
            item.className = 'gallery-item';

            // Cycle through 5 car-interior palettes
            const paletteClass = `palette-${i % 5}`;

            item.innerHTML = `
                <div class="placeholder ${paletteClass}"></div>
                <img src="${photo.src}" alt="${photo.label}" loading="lazy" decoding="async">
                <div class="overlay">
                    <span class="overlay-label">${photo.label}</span>
                </div>`;

            // Fade in image and hide placeholder once loaded
            const img = item.querySelector('img');
            const placeholder = item.querySelector('.placeholder');
            const onLoad = () => {
                img.classList.add('loaded');
                placeholder.classList.add('hide');
            };
            img.onload = onLoad;
            if (img.complete) onLoad();

            item.addEventListener('click', () => openLightbox(i));
            gallery.appendChild(item);
            setTimeout(() => item.classList.add('show'), i * 70);
        });
    }

    function filterGallery(tag, btn) {
        currentFilter = tag;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderGallery();
    }

    function openLightbox(index) {
        currentIndex = index;
        const list = visiblePhotos();
        document.getElementById('lightboxImg').src = list[index].src;
        document.getElementById('lightboxCounter').textContent = `${index + 1} / ${list.length}`;
        document.getElementById('lightbox').classList.add('open');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
    }

    function changePhoto(dir) {
        const list = visiblePhotos();
        currentIndex = (currentIndex + dir + list.length) % list.length;
        document.getElementById('lightboxImg').src = list[currentIndex].src;
        document.getElementById('lightboxCounter').textContent = `${currentIndex + 1} / ${list.length}`;
    }

    document.getElementById('lightbox').addEventListener('click', e => {
        if (e.target === document.getElementById('lightbox')) closeLightbox();
    });

    document.addEventListener('keydown', e => {
        if (!document.getElementById('lightbox').classList.contains('open')) return;
        if (e.key === 'ArrowRight') changePhoto(1);
        if (e.key === 'ArrowLeft')  changePhoto(-1);
        if (e.key === 'Escape')     closeLightbox();
    });

    renderGallery();
</script>
</body>
</html>
